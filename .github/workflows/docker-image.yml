name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/kinola-iq/stock-analyst/stock-analyst-backend:${{ github.sha }}

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push image to GitHub Container Registry
      run: docker push ghcr.io/kinola-iq/stock-analyst/stock-analyst-backend:${{ github.sha }}

    - name: Push image to Docker Hub
      run: docker push docker.io/kinola/stock-analyst-backend:${{ github.sha }}
