name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ollama model
      run: |
        python -m venv venv
        source venv/bin/activate
        ollama pull qwen3:4b

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/kinola-iq/stock-analyst/stock-analyst-backend:${{ github.sha }}

    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Push image
      run: docker push ghcr.io/kinola-iq/stock-analyst/stock-analyst-backend:${{ github.sha }}
